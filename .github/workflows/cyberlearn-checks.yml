name: CyberLearn checks

on:
  push:
    branches:
      - feature/linux-fundamentals-room
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-build-placeholder
          NEXT_PUBLIC_API_URL: https://labs-api.onemedia.asia
          ACADEMY_API_URL: https://api.onemedia.asia
          VERCEL_SANDBOX_ENABLED: "false"
